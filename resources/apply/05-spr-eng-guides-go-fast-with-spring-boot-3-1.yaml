apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spr-eng-guides-go-fast-with-spring-boot-3-1
spec:
  title: "Spring Tips: Go Fast with Spring Boot 3.1"
  description: "This lab follows Josh Long's video and demonstrates Spring Boot 3.1 functionality."
  workshop:
    image: jdk17-environment:*
    files:
      - http:
          url: "$(ingress_protocol)://$(assets_repository)/$(workshop_name).tar.gz"
        includePaths:
          - /workshop/**
      - path: .local/share/code-server
        image:
          url: ghcr.io/spring-academy/vscode-java-tools-$(platform_arch)-files:0.25.14
      - path: exercises
        git:
          url: https://github.com/spring-academy/course-spring-6-boot-3-upgrade-code
          ref: main
        newRootPath: .
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    env:
      - name: LAB_VERSION
        value: "${VERSION}"
      - name: WEBSERVER
        value: "$(ingress_protocol)://$(assets_repository)"
      - name: LESSON_LABEL
        value: boot-3-1-start
    namespaces:
      budget: medium
    resources:
      memory: 2Gi
    applications:
      terminal:
        enabled: true
        layout: default
      editor:
        enabled: true
      docker:
        enabled: true
        storage: 500Mi
        socket:
          # you must have this to enable docker ps, etc.
          enabled: true
    dashboards:
      - name: Editor
      - name: Terminal
      - name: "🎥 Video - Spring Tips - go fast with Spring Boot 3-1"
        url: "https://www.youtube.com/embed/ykEK2xuJrN8"
  environment:
    assets:
      memory: 0Mi
      ingress:
        enabled: true
      files:
        - image:
            url: ${CONTAINER_REGISTRY}${CONTAINER_REPOSITORY}:${VERSION}
          newRootPath: usr/share/nginx/html
