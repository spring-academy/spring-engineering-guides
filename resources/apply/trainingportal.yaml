apiVersion: training.educates.dev/v1beta1
kind: TrainingPortal
metadata:
  name: spring-engineering-guides
spec:
  portal:
    title: Spring Academy / Engineering Guides
    registration:
      type: anonymous
    updates:
      workshop: true
    sessions:
      maximum: 180
    theme:
      frame:
        ancestors:
        - https://spring.academy
        - https://*.spring.academy
        - https://*.vmware.com
        - https://*.broadcom.com
        - https://spring-staging.academy
        - https://spring-academy.broadcom.com
        - https://spring-academy-verify.broadcom.com
        - https://spring-academy-qa.broadcom.net
        - https://spring-academy-dev.broadcom.net
        - http://localhost:8080
  analytics:
    google:
      trackingId: "${ANALYTICS_GOOGLE_ID}"
    clarity:
      trackingId: "${ANALYTICS_CLARITY_ID}"
  workshops:
    - name: spr-eng-guides-go-fast-with-spring-boot-3-1
      expires: 60m
      orphaned: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spr-eng-guides-hugo
      expires: 60m
      orphaned: 5m
      reserved: 0
    - name: spr-eng-guides-what-is-new-spring-boot-3-2
      expires: 60m
      orphaned: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spr-eng-guides-restclient-httpinterfaces
      expires: 60m
      orphaned: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
    - name: spr-eng-guides-spring-ai
      expires: 60m
      orphaned: 5m
      reserved: ${TRAINING_PORTAL_RESERVED}
